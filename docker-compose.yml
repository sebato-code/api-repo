services:
  api:
    build: .
    ports:
      - "${API_PORT:-8071}:80"
    environment:
      - ENV=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped